<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Heebo","Arial Hebrew","Arial",sans-serif;
  background:radial-gradient(900px 500px at 88% -10%,#fbf5e9,rgba(0,0,0,0) 60%),linear-gradient(135deg,#f5f0e8,#ece2d2);
  display:flex;align-items:center;gap:44px;padding:56px 70px}
.txt{width:300px;flex-shrink:0}
.kick{font-size:20px;font-weight:700;letter-spacing:.14em;color:#946f3c;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.kick::before{content:"";width:36px;height:3px;border-radius:3px;background:#b08a54}
h1{font-size:64px;font-weight:800;color:#332c25;line-height:1.0;letter-spacing:-.02em;margin:20px 0 16px}
.lead{font-size:21px;color:#645a4f;font-weight:500;line-height:1.35}
.cats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:16px;height:466px}
.tile{background:#fff;border:1px solid #efe7d9;border-radius:20px;box-shadow:0 16px 36px -18px rgba(70,50,20,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.tile .e{font-size:40px;line-height:1}
.tile .l{font-size:19px;font-weight:700;color:#332c25}
</style></head><body>
<div class="txt">
  <div class="kick">הבית שלנו</div>
  <h1>לוח החלטות</h1>
  <div class="lead">מה בוחרים לבית — תאורה, צבעים, מכשירי חשמל ועוד. הכול במקום אחד, נוח לבחירה ולשיתוף.</div>
</div>
<div class="cats">
  <div class="tile"><span class="e">💡</span><span class="l">תאורה</span></div>
  <div class="tile"><span class="e">🎨</span><span class="l">צבעים</span></div>
  <div class="tile"><span class="e">🔩</span><span class="l">ידיות</span></div>
  <div class="tile"><span class="e">☕</span><span class="l">מכונות קפה</span></div>
  <div class="tile"><span class="e">♨️</span><span class="l">מיקרוגל</span></div>
  <div class="tile"><span class="e">🔥</span><span class="l">תנור</span></div>
  <div class="tile"><span class="e">🍳</span><span class="l">כיריים</span></div>
  <div class="tile"><span class="e">🫧</span><span class="l">מדיח</span></div>
  <div class="tile"><span class="e">🧊</span><span class="l">מקרר</span></div>
</div>
</body></html>
