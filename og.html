<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Heebo","Arial Hebrew","Arial",sans-serif;
  background:radial-gradient(900px 500px at 88% -10%,#fbf5e9,rgba(0,0,0,0) 60%),linear-gradient(135deg,#f5f0e8,#ece2d2);
  display:flex;align-items:center;gap:50px;padding:70px 80px}
.txt{flex:1;min-width:0}
.kick{font-size:22px;font-weight:700;letter-spacing:.14em;color:#946f3c;text-transform:uppercase;
  display:flex;align-items:center;gap:12px}
.kick::before{content:"";width:40px;height:3px;border-radius:3px;background:#b08a54}
h1{font-size:76px;font-weight:800;color:#332c25;line-height:1.02;letter-spacing:-.02em;margin:22px 0 26px}
.meta{display:inline-flex;gap:14px;align-items:center}
.chip{background:#fff;border:1.5px solid #e8dfce;border-radius:999px;padding:12px 24px;font-size:26px;font-weight:700;color:#332c25;
  box-shadow:0 6px 18px -10px rgba(95,72,40,.4)}
.chip .m{color:#946f3c}
.foot{margin-top:34px;font-size:22px;color:#8a7d6d;font-weight:500}
.gal{width:430px;height:490px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;flex-shrink:0}
.gal div{border-radius:22px;background:#fff center/cover no-repeat;box-shadow:0 20px 45px -18px rgba(70,50,20,.5);border:1px solid #efe7d9}
</style></head><body>
<div class="txt">
  <div class="kick">הבית של עידה</div>
  <h1>רשימת המשאלות שלי</h1>
  <div class="meta"><span class="chip">35 פריטי תאורה</span><span class="chip"><span class="m">₪11,609</span></span></div>
  <div class="foot">להסרה, עדכון כמויות והוספת הערות ✦ לחצו לצפייה</div>
</div>
<div class="gal">
  <div style="background-image:url('img/product-2419.jpg')"></div>
  <div style="background-image:url('img/k2.webp')"></div>
  <div style="background-image:url('img/product-321.jpg')"></div>
  <div style="background-image:url('img/tomazo-1.webp')"></div>
</div>
</body></html>
